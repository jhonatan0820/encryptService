crypto:
  rsa:
    private-key-pkcs8-base64: "<service-private-key-pkcs8-base64>"
    public-key-spki-base64: "<service-public-key-spki-base64>"
  web-rsa:
    profiles:
      encryptservice:
        private-key-pkcs8-base64: "<encryptservice-web-private-key-pkcs8-base64>"
        public-key-spki-base64: "<encryptservice-web-public-key-spki-base64>"
      tokenservice:
        private-key-pkcs8-base64: "<tokenservice-web-private-key-pkcs8-base64>"
        public-key-spki-base64: "<tokenservice-web-public-key-spki-base64>"
  aes:
    active-key-id: "2026a"
    keys:
      2026a: "<base64-encoded-32-byte-global-aes-key>"
      ENCR: "<base64-encoded-32-byte-encryptservice-web-aes-key>"
      TOKN: "<base64-encoded-32-byte-tokenservice-web-aes-key>"
